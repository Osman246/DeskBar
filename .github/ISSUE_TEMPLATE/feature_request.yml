name: Idea
description: Suggest something DeskBar could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: DeskBar is deliberately small. The best ideas answer a real question someone has about their Mac, so start with the question.
  - type: textarea
    id: question
    attributes:
      label: What do you want to know about your Mac?
      placeholder: "Why is my fan loud right now?"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could DeskBar answer it?
